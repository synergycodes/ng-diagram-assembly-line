<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Production Monitor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Set the theme before first paint to avoid a flash. Defaults to dark.
      (function () {
        try {
          var t = localStorage.getItem('assemblyflow-theme');
          document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
