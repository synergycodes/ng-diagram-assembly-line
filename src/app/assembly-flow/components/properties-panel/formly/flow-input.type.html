<label class="flow-field">
  <span class="flow-field__label">
    <span class="flow-field__label-text">{{ props.label }}</span>
    @if (props['unit']) {
      <span class="flow-field__unit">{{ props['unit'] }}</span>
    }
  </span>
  <input
    class="flow-field__input"
    [type]="props['inputType'] || 'text'"
    [formControl]="formControl"
    [formlyAttributes]="field"
  />
</label>
