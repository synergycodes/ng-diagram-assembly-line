<div class="shell" [attr.data-mode]="mode()">
  <app-diagram class="canvas" />

  <app-header class="header" />

  @if (mode() === 'edit') {
    <app-palette class="left" />
  }

  @if (mode() === 'edit') {
    <app-properties-panel class="right" />
  } @else {
    <app-node-inspector class="right" />
  }
</div>
