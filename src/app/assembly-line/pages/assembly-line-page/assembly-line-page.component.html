<div class="shell">
  <app-header />

  <div class="layout" [attr.data-mode]="mode()">
    @if (mode() === 'edit') {
      <app-palette class="left" />
    }
    <app-diagram class="center" />
    @if (mode() === 'edit') {
      <app-properties-panel class="right" />
    } @else {
      <app-node-inspector class="right" />
    }
  </div>
</div>
