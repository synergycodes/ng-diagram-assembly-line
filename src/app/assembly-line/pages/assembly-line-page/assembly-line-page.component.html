<div class="shell" [attr.data-mode]="mode()">
  <app-diagram class="canvas" [rightPanelCollapsed]="rightPanelCollapsed()" />
  <app-header class="header" />
  <app-palette class="left" [class.collapsed]="mode() !== 'edit'" />
  <app-right-panel
    class="right"
    [collapsed]="rightPanelCollapsed()"
    (collapsedChange)="rightPanelCollapsed.set($event)"
  />
  <app-minimap-panel class="minimap" [class.right-collapsed]="rightPanelCollapsed()" />
</div>
