name: Deploy to Azure

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href /templates/assembly-line/

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Clear existing blobs
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob delete-batch \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --source '${{ vars.AZURE_STORAGE_CONTAINER }}' \
              --pattern 'assembly-line/*' \
              --auth-mode login

      - name: Upload to blob container
        uses: azure/cli@v3
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --destination '${{ vars.AZURE_STORAGE_CONTAINER }}' \
              --destination-path 'assembly-line' \
              --source ./dist/assembly-line/browser \
              --overwrite true \
              --auth-mode login
